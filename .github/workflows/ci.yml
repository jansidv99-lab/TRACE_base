# Phase 6 – Step 6.1: continuous integration — lint and test every PR and every push to main
#
# Runs on a clean Linux machine with NO secrets: tests that call the real LLM are marked `llm`
# and skipped by default (pyproject.toml), and src/config.py falls back to safe defaults when
# there is no .env. The CD workflow (Step 6.4) deploys only after this workflow succeeds on main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: CI only needs to read the code
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (pip cache keyed on the dev requirements)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest; real-LLM tests skipped)
        run: pytest
